apiVersion: v1
kind: ServiceAccount
metadata:
  name: ib-sriov-cni
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ib-sriov-cni
rules:
  # Pod get/patch is cluster-wide because Kubernetes RBAC cannot scope pod
  # access to a single node. The plugin only writes the connection-details
  # annotation on pods scheduled to its own node, and only when a NAD sets
  # publishPfGuid; the --gen-kubeconfig identity is otherwise unused.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ib-sriov-cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ib-sriov-cni
subjects:
  - kind: ServiceAccount
    name: ib-sriov-cni
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-ib-sriov-cni-ds-amd64
  namespace: kube-system
  labels:
    tier: node
    app: ib-sriov-cni
spec:
  selector:
    matchLabels:
      name: ib-sriov-cni
  template:
    metadata:
      labels:
        tier: node
        app: ib-sriov-cni
        name: ib-sriov-cni
    spec:
      hostNetwork: true
      serviceAccountName: ib-sriov-cni
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kube-ib-sriov-cni
          image: ghcr.io/k8snetworkplumbingwg/ib-sriov-cni
          imagePullPolicy: IfNotPresent
          args:
            - --gen-kubeconfig
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "50Mi"
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
            - name: cninet
              mountPath: /host/etc/cni/net.d
      volumes:
        - name: cnibin
          hostPath:
            path: /opt/cni/bin
        - name: cninet
          hostPath:
            path: /etc/cni/net.d
